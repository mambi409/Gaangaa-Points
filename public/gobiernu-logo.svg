<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a192f"/>
      <stop offset="50%" stop-color="#0f2b5c"/>
      <stop offset="100%" stop-color="#071224"/>
    </linearGradient>
    
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE066"/>
      <stop offset="50%" stop-color="#F5B700"/>
      <stop offset="100%" stop-color="#D49200"/>
    </linearGradient>

    <linearGradient id="shieldBlue" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#003da5"/>
      <stop offset="100%" stop-color="#002060"/>
    </linearGradient>

    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="800" height="500" fill="url(#bgGrad)"/>
  
  <!-- Subtle decorative background geometric lines -->
  <circle cx="400" cy="250" r="220" fill="none" stroke="#1e3a8a" stroke-width="1.5" stroke-dasharray="6,6" opacity="0.4"/>
  <circle cx="400" cy="250" r="180" fill="none" stroke="#3b82f6" stroke-width="1" opacity="0.2"/>

  <!-- Centered Government Emblem Container -->
  <g transform="translate(400, 190)" filter="url(#shadow)">
    <!-- Outer Golden Crest Ring -->
    <circle cx="0" cy="0" r="94" fill="#091830" stroke="url(#goldGrad)" stroke-width="4"/>
    <circle cx="0" cy="0" r="86" fill="none" stroke="#60a5fa" stroke-width="1" opacity="0.3"/>

    <!-- Shield of Curaçao -->
    <path d="M -48,-42 C -48,-42 48,-42 48,-42 C 48,15 36,55 0,72 C -36,55 -48,15 -48,-42 Z" 
          fill="url(#shieldBlue)" 
          stroke="url(#goldGrad)" 
          stroke-width="3"/>

    <!-- Yellow Stripe in Shield (Flag of Curaçao) -->
    <path d="M -47,8 C -25,18 25,18 47,8 L 46,20 C 25,30 -25,30 -46,20 Z" 
          fill="url(#goldGrad)"/>

    <!-- Top Left 5-point Star (Curaçao Island) -->
    <!-- Star 1 (Large) -->
    <g transform="translate(-22, -20) scale(1.1)">
      <polygon points="0,-12 3.7,-3.7 12.6,-3.7 5.4,1.5 8.1,9.7 0,4.6 -8.1,9.7 -5.4,1.5 -12.6,-3.7 -3.7,-3.7" fill="#FFFFFF"/>
    </g>

    <!-- Star 2 (Small - Klein Curaçao) -->
    <g transform="translate(-8, -3) scale(0.7)">
      <polygon points="0,-12 3.7,-3.7 12.6,-3.7 5.4,1.5 8.1,9.7 0,4.6 -8.1,9.7 -5.4,1.5 -12.6,-3.7 -3.7,-3.7" fill="#FFFFFF"/>
    </g>

    <!-- Right Shield Symbolism: Orange Branch / Rising Sun rays -->
    <g transform="translate(18, -12)">
      <path d="M -5,0 C 0,-12 15,-10 18,-4 C 12,8 0,8 -5,0 Z" fill="#F59E0B" opacity="0.9"/>
      <circle cx="8" cy="-2" r="3" fill="#FDE68A"/>
    </g>

    <!-- Crown on top of Shield -->
    <g transform="translate(0, -48)">
      <path d="M -24,0 L -20,-12 L -8,-4 L 0,-16 L 8,-4 L 20,-12 L 24,0 Z" fill="url(#goldGrad)" stroke="#B45309" stroke-width="1"/>
      <circle cx="-20" cy="-13" r="2" fill="#FFFFFF"/>
      <circle cx="0" cy="-17" r="2.5" fill="#FFFFFF"/>
      <circle cx="20" cy="-13" r="2" fill="#FFFFFF"/>
    </g>
  </g>

  <!-- Typography: Official Titles -->
  <text x="400" y="340" text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="28" fill="#FFFFFF" letter-spacing="4">
    GOBIÈRNU DI KÒRSOU
  </text>
  
  <text x="400" y="375" text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="15" fill="#93C5FD" letter-spacing="3">
    REGERING VAN CURAÇAO • GOVERNMENT OF CURAÇAO
  </text>

  <!-- Bottom Badge / Portal Tag -->
  <g transform="translate(400, 420)">
    <rect x="-110" y="-14" width="220" height="28" rx="14" fill="#1e293b" stroke="#3b82f6" stroke-width="1.2"/>
    <text x="0" y="5" text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="12" fill="#60A5FA" letter-spacing="1.5">
      🌐 gobiernu.cw • OFISIAL
    </text>
  </g>
</svg>
